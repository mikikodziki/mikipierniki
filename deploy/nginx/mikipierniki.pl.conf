# nginx: /etc/nginx/sites-available/mikipierniki.pl.conf (symlink into sites-enabled).
# Static files come straight from the current release; everything else goes to the Node
# process (terms, forms, panel). Certificates: certbot --nginx -d mikipierniki.pl -d www.mikipierniki.pl

# Form posts per visitor: generous for people, tight for scripts. GETs are not limited.
map $request_method $mp_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $mp_post_key zone=mp_post:10m rate=20r/m;

upstream mikipierniki_node {
    server 127.0.0.1:4390;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name mikipierniki.pl www.mikipierniki.pl;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://mikipierniki.pl$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mikipierniki.pl;
    ssl_certificate     /etc/letsencrypt/live/mikipierniki.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikipierniki.pl/privkey.pem;
    return 301 https://mikipierniki.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mikipierniki.pl;
    ssl_certificate     /etc/letsencrypt/live/mikipierniki.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikipierniki.pl/privkey.pem;

    root /srv/mikipierniki/current/dist/client;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # HTML is ~115 KB raw, ~30 KB gzipped (CSS is inlined)
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    limit_req zone=mp_post burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    # fingerprinted build output and fonts never change under the same name.
    # Only `expires` here: an add_header inside a location would drop the server-level headers above.
    location ^~ /_astro/ { expires 1y; try_files $uri =404; }
    location ^~ /fonts/  { expires 1y; try_files $uri =404; }
    location ^~ /zdjecia/ { expires 30d; try_files $uri =404; }

    # clean URLs: /faq → faq.html (build.format "file"); anything not on disk goes to Node,
    # which renders /, /warsztaty, /panel, /api/* and the 404 page
    location / {
        try_files $uri $uri.html @node;
    }

    location @node {
        proxy_pass http://mikipierniki_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
