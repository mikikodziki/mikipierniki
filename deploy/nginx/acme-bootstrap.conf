# Temporary config for the very first certificate only (the full config needs the
# certificate files to exist before nginx accepts it). Remove after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name mikipierniki.pl www.mikipierniki.pl;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}
